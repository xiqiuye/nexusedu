name: nexusedu

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: nexus-edu
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ../backend/doc/sql/table_init.sql:/docker-entrypoint-initdb.d/01-table_init.sql:ro
      - ../backend/doc/sql/system_data_init.sql:/docker-entrypoint-initdb.d/02-system_data_init.sql:ro
      - ../backend/doc/sql/data_init.sql:/docker-entrypoint-initdb.d/03-data_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexus_edu_knowledge
      POSTGRES_USER: ${POSTGRES_USER:-nexusedu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: Asia/Shanghai
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../backend/doc/sql/postgres_knowledge_chunk.sql:/docker-entrypoint-initdb.d/01-knowledge_chunk.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "--appendonly", "yes"]
    environment:
      TZ: Asia/Shanghai
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    image: ${IMAGE_PREFIX:-nexusedu}/backend:${APP_VERSION:-local}
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: 9090
      NEXUSEDU_DATASOURCE_URL: jdbc:mysql://mysql:3306/nexus-edu?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
      NEXUSEDU_DATASOURCE_USERNAME: root
      NEXUSEDU_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KNOWLEDGE_VECTOR_STORE: postgres
      KNOWLEDGE_POSTGRES_URL: jdbc:postgresql://postgres:5432/nexus_edu_knowledge
      KNOWLEDGE_POSTGRES_USERNAME: ${POSTGRES_USER:-nexusedu}
      KNOWLEDGE_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KNOWLEDGE_POSTGRES_TABLE: ${KNOWLEDGE_POSTGRES_TABLE:-ai_knowledge_chunk}
      INTERNAL_RPC_SECRET: ${INTERNAL_RPC_SECRET:?INTERNAL_RPC_SECRET is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ACCESS_TOKEN_TTL_SECONDS: ${JWT_ACCESS_TOKEN_TTL_SECONDS:-7200}
      JWT_REFRESH_TOKEN_TTL_SECONDS: ${JWT_REFRESH_TOKEN_TTL_SECONDS:-604800}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_ENDPOINT: ${EMBEDDING_ENDPOINT:?EMBEDDING_ENDPOINT is required}
      EMBEDDING_TOKEN: ${EMBEDDING_TOKEN:?EMBEDDING_TOKEN is required}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      KNOWLEDGE_UPLOAD_DIRECTORY: /app/data/knowledge-uploads
    volumes:
      - knowledge-uploads:/app/data/knowledge-uploads
    expose:
      - "9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/ || test $$? -eq 8"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    image: ${IMAGE_PREFIX:-nexusedu}/frontend:${APP_VERSION:-local}
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        VITE_API_URL: /
        VITE_BASE_URL: ${VITE_BASE_URL:-/}
        VITE_VERSION: ${APP_VERSION:-local}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
  postgres-data:
  redis-data:
  knowledge-uploads:
