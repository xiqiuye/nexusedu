spring:
  application:
    name: nexusedu
  config:
    import: optional:file:backend/nexusedu-server/.env[.properties],optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: 4MB
      max-request-size: 5MB
  datasource:
    url: ${NEXUSEDU_DATASOURCE_URL:jdbc:mysql://localhost:3306/nexus-edu?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${NEXUSEDU_DATASOURCE_USERNAME:root}
    password: ${NEXUSEDU_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

server:
  port: ${SERVER_PORT:9090}

nexusedu:
  internal-rpc:
    secret: ${INTERNAL_RPC_SECRET}
  system:
    jwt:
      secret: ${JWT_SECRET}
      access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:7200}
      refresh-token-ttl-seconds: ${JWT_REFRESH_TOKEN_TTL_SECONDS:604800}
  knowledge:
    upload-directory: ${KNOWLEDGE_UPLOAD_DIRECTORY:./data/knowledge-uploads}
    vector-store: ${KNOWLEDGE_VECTOR_STORE:postgres}
    embedding-dimensions: ${EMBEDDING_DIMENSIONS:1536}
    postgres:
      url: ${KNOWLEDGE_POSTGRES_URL}
      username: ${KNOWLEDGE_POSTGRES_USERNAME}
      password: ${KNOWLEDGE_POSTGRES_PASSWORD}
      table: ${KNOWLEDGE_POSTGRES_TABLE:ai_knowledge_chunk}
    milvus:
      endpoint: ${MILVUS_ENDPOINT:}
      token: ${MILVUS_TOKEN:}
      collection: ${MILVUS_COLLECTION:ai_knowledge_chunk}
  ai:
    embedding:
      provider: ${EMBEDDING_PROVIDER:openai}
      endpoint: ${EMBEDDING_ENDPOINT}
      token: ${EMBEDDING_TOKEN}
      model: ${EMBEDDING_MODEL:text-embedding-3-small}
      dimensions: ${EMBEDDING_DIMENSIONS:1536}
    knowledge-ingestion:
      default-limit: ${AI_KNOWLEDGE_INGESTION_DEFAULT_LIMIT:1000}
      max-limit: ${AI_KNOWLEDGE_INGESTION_MAX_LIMIT:10000}
      default-index-revision: ${AI_KNOWLEDGE_INGESTION_DEFAULT_INDEX_REVISION:1}
    workflow:
      core-pool-size: ${AI_WORKFLOW_CORE_POOL_SIZE:4}
      max-pool-size: ${AI_WORKFLOW_MAX_POOL_SIZE:8}
      queue-capacity: ${AI_WORKFLOW_QUEUE_CAPACITY:100}
      max-attempts: ${AI_WORKFLOW_MAX_ATTEMPTS:3}
      step-timeout-ms: ${AI_WORKFLOW_STEP_TIMEOUT_MS:30000}
      business-result-ttl-minutes: ${AI_WORKFLOW_BUSINESS_RESULT_TTL_MINUTES:30}
    task-executor:
      core-pool-size: ${AI_TASK_EXECUTOR_CORE_POOL_SIZE:8}
      max-pool-size: ${AI_TASK_EXECUTOR_MAX_POOL_SIZE:32}
      queue-capacity: ${AI_TASK_EXECUTOR_QUEUE_CAPACITY:200}
    sse-executor:
      core-pool-size: ${AI_SSE_EXECUTOR_CORE_POOL_SIZE:4}
      max-pool-size: ${AI_SSE_EXECUTOR_MAX_POOL_SIZE:16}
      queue-capacity: ${AI_SSE_EXECUTOR_QUEUE_CAPACITY:100}
    task-recovery-delay-ms: ${AI_TASK_RECOVERY_DELAY_MS:10000}
    stream-event-ttl-minutes: ${AI_STREAM_EVENT_TTL_MINUTES:5}
    chat-memory-max-messages: ${AI_CHAT_MEMORY_MAX_MESSAGES:40}
